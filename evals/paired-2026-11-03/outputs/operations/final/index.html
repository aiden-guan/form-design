<body>
<a class="skip" href="#loan-search">Skip to loan search</a>
<header class="app-header">
 <div class="brand"><svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true"><path d="M7 8h13c9 0 14 4 14 12S29 32 20 32H7V8Z" fill="none" stroke="currentColor" stroke-width="4"/><path d="M7 15h13M7 24h13" stroke="currentColor" stroke-width="4"/></svg><div><div class="wordmark">Dispatch</div><div class="brand-description">Equipment lending desk</div></div></div>
 <div class="environment"><span class="demo-label">Offline demo</span></div>
</header>
<main>
 <div class="page-heading"><div class="heading-group"><h1>Loans</h1><span class="active-summary" id="active-summary">6 active loans</span></div><button class="undo-button" id="undo" disabled>Undo last return</button></div>
 <div id="notification" class="notification" role="status" aria-live="polite"></div>
 <div class="workspace">
  <section class="loans-section" aria-label="Equipment loans">
   <div class="filter-bar"><div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg><label class="sr-only" for="loan-search">Search by person, equipment or loan ID</label><input id="loan-search" type="search" placeholder="Search person, equipment or ID" autocomplete="off"><button type="button" class="clear-search" id="clear-search" aria-label="Clear search" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><span class="result-count" id="result-count" aria-live="polite">6 loans</span></div>
   <div class="status-tabs" id="status-tabs" role="group" aria-label="Filter loans by status"></div>
   <div class="mobile-filter"><div class="select-wrap"><label for="status-select">Status</label><select id="status-select" aria-label="Filter loans by status"></select></div><span class="mobile-count" id="mobile-count">6 loans</span></div>
   <div class="table" role="table" aria-label="Equipment loans" aria-rowcount="7">
    <div class="table-head" role="row"><div role="columnheader">Borrower / loan</div><div role="columnheader">Equipment</div><div role="columnheader">Due</div><div role="columnheader">Status</div><span class="sr-only" role="columnheader">Details</span></div>
    <div id="loan-list" role="rowgroup"></div>
   </div>
   <div class="list-footer"><span id="list-summary">Showing all 6 loans</span><span>All times as listed</span></div>
  </section>
  <aside class="desktop-detail" id="desktop-detail" aria-label="Selected loan"></aside>
 </div>
 <footer class="page-foot"><p>Fictional lending data. Returns affect this demo on this device only.</p></footer>
</main>
<dialog class="dialog" id="loan-dialog" aria-label="Loan details"><div id="mobile-detail"></div></dialog>
<script>
'use strict';
const loans=[
{id:'L-1042',person:'Amara Okafor',item:'Sony A7 IV kit',due:'Today, 16:00',state:'Due today',type:'camera'},
{id:'L-1043',person:'Min-Jae Park',item:'Zoom H6 field recorder',due:'Yesterday, 17:00',state:'Overdue',type:'recorder'},
{id:'L-1044',person:'Alexandria Montgomery-Wright',item:'Manfrotto carbon-fibre tripod + fluid head',due:'Tomorrow, 12:00',state:'On loan',type:'tripod'},
{id:'L-1045',person:'Inez Silva',item:'Aputure 120d light kit',due:'Today, 18:00',state:'Due today',type:'light'},
{id:'L-1046',person:'Noor Rahman',item:'Sennheiser wireless lavalier pair',due:'Friday, 10:00',state:'On loan',type:'mic'},
{id:'L-1047',person:'Theo Bell',item:'Canon RF 24–70mm lens',due:'Yesterday, 12:00',state:'Overdue',type:'lens'}];
const statuses=['All loans','Overdue','Due today','On loan','Returned'];
const key='dispatch-offline-demo-v1';
let returned=new Set(),lastReturn=null,status='All loans',query='',selectedId=loans[0].id,storageAvailable=true;
try{const saved=JSON.parse(localStorage.getItem(key)||'null');if(saved){returned=new Set((saved.returned||[]).filter(id=>loans.some(l=>l.id===id)));lastReturn=returned.has(saved.lastReturn)?saved.lastReturn:null;}}catch(e){storageAvailable=false;}
const el=id=>document.getElementById(id),dialog=el('loan-dialog');
const esc=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const currentState=loan=>returned.has(loan.id)?'Returned':loan.state;
const stateClass=loan=>currentState(loan).toLowerCase().replace(/ /g,'-');
const normalize=value=>value.normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
function icon(type){const paths={camera:'<path d="M3 8h5l2-3h5l2 3h4v12H3Z"/><circle cx="12" cy="14" r="4"/><path d="M18 11h1"/>',recorder:'<rect x="7" y="6" width="10" height="16" rx="2"/><path d="m7 2 10 5M17 2 7 7M10 10h4v4h-4zM10 17h4M10 19h4"/>',tripod:'<path d="M7 5h10v4H7zM12 9v7M12 13 5 22M12 13l7 9M12 13v9M12 5V2M17 7h5"/>',light:'<path d="m3 7 13-3v12L3 13ZM16 6h5v8h-5M10 15v7M6 22h8"/>',mic:'<rect x="3" y="12" width="7" height="10" rx="1"/><rect x="14" y="12" width="7" height="10" rx="1"/><path d="M6 12V5M17 12V5M4 7a4 4 0 0 1 4 0M15 7a4 4 0 0 1 4 0M5 16h3M16 16h3"/>',lens:'<path d="M6 5c0-2 12-2 12 0v14c0 3-12 3-12 0Z"/><path d="M6 6c0 3 12 3 12 0M6 10c0 3 12 3 12 0M6 16c0 3 12 3 12 0M9 11v5M12 12v5M15 11v5"/>'};return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+paths[type]+'</svg>';}
const checkIcon='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg>';
function count(filter){return filter==='All loans'?loans.length:loans.filter(l=>currentState(l)===filter).length;}
function filtered(){const q=normalize(query.trim());return loans.filter(l=>(status==='All loans'||currentState(l)===status)&&(!q||normalize(l.person+' '+l.item+' '+l.id).includes(q)));}
function save(){try{localStorage.setItem(key,JSON.stringify({returned:[...returned],lastReturn}));}catch(e){storageAvailable=false;}}
function filterControls(){el('status-tabs').innerHTML=statuses.map(s=>'<button type="button" class="tab" data-filter="'+s+'" aria-pressed="'+(status===s)+'">'+s+' <span class="tab-count">'+count(s)+'</span></button>').join('');const select=el('status-select');select.innerHTML=statuses.map(s=>'<option value="'+s+'"'+(status===s?' selected':'')+'>'+s+' ('+count(s)+')</option>').join('');}
function render(preserveSelection=false){const visible=filtered();if(!preserveSelection&&!visible.some(l=>l.id===selectedId))selectedId=visible[0]?.id||null;filterControls();el('active-summary').textContent=(loans.length-returned.size)+' active loan'+((loans.length-returned.size)===1?'':'s');el('undo').disabled=!lastReturn;el('clear-search').hidden=!query;const label=visible.length+' loan'+(visible.length===1?'':'s');el('result-count').textContent=label;el('mobile-count').textContent=label;el('list-summary').textContent=visible.length===loans.length?'Showing all 6 loans':'Showing '+visible.length+' of 6 loans';document.querySelector('.table').setAttribute('aria-rowcount',visible.length+1);
 if(!visible.length){el('loan-list').innerHTML='<div class="empty"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="m15 15 6 6M7 10h6"/></svg><h2>No matching loans</h2><p>Try another search or reset the filters.</p><button class="secondary" data-reset>Reset search &amp; filters</button></div>';}
 else{el('loan-list').innerHTML=visible.map(l=>{const parts=l.due.split(', ');return '<div class="loan-row'+(l.id===selectedId?' selected':'')+'" role="row" data-loan="'+l.id+'"><div class="borrower" role="cell"><div class="person">'+esc(l.person)+'</div><div class="loan-id">'+l.id+'</div></div><div class="equipment" role="cell"><span class="equipment-icon">'+icon(l.type)+'</span><span>'+esc(l.item)+'</span></div><div class="due" role="cell"><span class="due-day">'+parts[0]+'</span><span class="sr-only">, </span><span class="due-time">'+parts[1]+'</span></div><div class="state '+stateClass(l)+'" role="cell">'+currentState(l)+'</div><div role="cell" class="view-cell"><button class="view-button" data-open="'+l.id+'" aria-label="Open loan '+l.id+' for '+esc(l.person)+'"'+(l.id===selectedId?' aria-current="true"':'')+'>Open</button></div></div>';}).join('');}
 renderDetails();}
function details(loan,mobile){if(!loan)return '<div class="detail-panel placeholder-detail"><h2>No loan selected</h2><p>Reset the filters to find a loan.</p></div>';const isReturned=returned.has(loan.id);return '<div class="detail-panel"><div class="detail-top"><h2>Loan details</h2><span class="small-id">'+loan.id+'</span>'+(mobile?'<button class="close-detail" data-close aria-label="Close loan details"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>':'')+'</div><div class="detail-content"><div class="detail-item"><div class="large-icon">'+icon(loan.type)+'</div><h3>'+esc(loan.item)+'</h3></div><dl class="detail-definition"><div><dt>Borrower</dt><dd class="borrower-name">'+esc(loan.person)+'</dd></div><div class="detail-pair"><div><dt>Due</dt><dd>'+loan.due+'</dd></div><div><dt>Status</dt><dd class="state '+stateClass(loan)+'">'+currentState(loan)+'</dd></div></div></dl><div class="return-section">'+(isReturned?'<div class="returned-confirmation">'+checkIcon+'Return recorded locally</div><p>This equipment is marked returned in this demo.</p>'+(lastReturn===loan.id?'<button class="secondary" data-undo>Undo this return</button>':''):'<h3>Record a return</h3><p>Confirm the equipment is back at the desk before marking it returned.</p><button class="primary" data-return="'+loan.id+'">Mark returned locally</button>')+'<div class="local-note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="4" y="3" width="16" height="13" rx="1"/><path d="M2 20h20M9 16v4M15 16v4"/></svg><span>'+(storageAvailable?'Saved on this device. No live record is changed.':'Browser storage unavailable. Changes last for this visit.')+'</span></div></div></div></div>';}
function renderDetails(){const loan=loans.find(l=>l.id===selectedId);el('desktop-detail').innerHTML=details(loan,false);if(dialog.open)el('mobile-detail').innerHTML=details(loan,true);}
function openLoan(id){selectedId=id;render();if(window.matchMedia('(max-width: 1180px)').matches){el('mobile-detail').innerHTML=details(loans.find(l=>l.id===id),true);dialog.showModal();}else{el('desktop-detail').querySelector('[data-return], [data-undo]')?.focus({preventScroll:true});}}
function notify(message,undo=false){const box=el('notification');box.classList.add('visible');box.innerHTML='<span class="notification-content">'+checkIcon+'<span>'+esc(message)+'</span></span>'+(undo?'<button data-undo>Undo</button>':'<button class="dismiss-note" data-dismiss>Dismiss</button>');}
function returnLoan(id){const loan=loans.find(l=>l.id===id);if(!loan||returned.has(id))return;returned.add(id);lastReturn=id;save();render(true);if(dialog.open){el('mobile-detail').innerHTML=details(loan,true);el('mobile-detail').querySelector('[data-undo]')?.focus();}else{el('desktop-detail').innerHTML=details(loan,false);el('desktop-detail').querySelector('[data-undo]')?.focus({preventScroll:true});}notify(id+' marked returned on this device',true);}
function undo(){if(!lastReturn)return;const id=lastReturn;returned.delete(id);lastReturn=null;save();selectedId=id;render(true);notify('Return undone. '+id+' is '+loans.find(l=>l.id===id).state.toLowerCase()+' again.');if(dialog.open){el('mobile-detail').innerHTML=details(loans.find(l=>l.id===id),true);el('mobile-detail').querySelector('[data-return]')?.focus();}else{el('desktop-detail').querySelector('[data-return]')?.focus({preventScroll:true});}}
function reset(){query='';status='All loans';el('loan-search').value='';render();el('loan-search').focus();}
el('loan-search').addEventListener('input',event=>{query=event.target.value;render();});el('clear-search').addEventListener('click',()=>{query='';el('loan-search').value='';render();el('loan-search').focus();});el('status-select').addEventListener('change',event=>{status=event.target.value;render();});el('undo').addEventListener('click',undo);
document.addEventListener('click',event=>{const target=event.target.closest('button');if(!target)return;if(target.dataset.filter){status=target.dataset.filter;render();el('status-tabs').querySelector('[data-filter="'+status+'"]')?.focus({preventScroll:true});}else if(target.dataset.open)openLoan(target.dataset.open);else if(target.dataset.return)returnLoan(target.dataset.return);else if(target.hasAttribute('data-undo'))undo();else if(target.hasAttribute('data-reset'))reset();else if(target.hasAttribute('data-close'))dialog.close();else if(target.hasAttribute('data-dismiss'))el('notification').classList.remove('visible');});
dialog.addEventListener('close',()=>{const target=window.matchMedia('(min-width:1181px)').matches?el('desktop-detail').querySelector('[data-return], [data-undo]'):document.querySelector('[data-open="'+selectedId+'"]');(target||el('loan-search')).focus({preventScroll:true});});
dialog.addEventListener('click',event=>{if(event.target===dialog){const rect=dialog.getBoundingClientRect();if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom)dialog.close();}});
document.addEventListener('keydown',event=>{if(event.key==='/'&&!dialog.open&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){event.preventDefault();el('loan-search').focus();}});
window.addEventListener('resize',()=>{if(dialog.open&&window.matchMedia('(min-width:1181px)').matches)dialog.close();});
render();
</script>
</body>
</html>
